<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | CollabX</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-900 font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- Navbar -->
  <nav class="sticky top-0 z-50 bg-stone-50/90 backdrop-blur-md border-b border-stone-200/80">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-700 flex items-center justify-center text-white font-bold text-xl">C</div>
        <span class="font-serif text-2xl font-bold tracking-tight text-stone-900">CollabX</span>
      </a>
      <a href="login.html" class="text-sm font-semibold bg-emerald-700 text-white px-5 py-2.5 rounded-full">Sign In</a>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-grow flex items-center justify-center py-12 px-6">
    <div class="w-full max-w-md bg-white rounded-3xl border border-stone-200 p-8 shadow-sm">
      <div class="text-center mb-8">
        <h1 class="text-2xl font-serif font-bold text-stone-900 mb-2">Reset Your Password</h1>
        <p class="text-xs text-stone-600">Enter your account email to receive reset instructions.</p>
      </div>

      <form id="forgotForm" class="space-y-6">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-2">Email Address *</label>
          <input type="email" name="email" required placeholder="yourname@gmail.com" class="w-full px-4 py-3 rounded-xl bg-stone-50 border border-stone-200 text-sm focus:outline-none focus:border-emerald-700">
        </div>

        <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-medium py-3.5 rounded-xl transition">
          Send Reset Link
        </button>
      </form>

      <p class="mt-6 text-center text-xs text-stone-500">
        Remembered password? <a href="login.html" class="text-emerald-700 font-semibold hover:underline">Log in here</a>
      </p>
    </div>
  </main>

  <footer class="bg-stone-100 border-t border-stone-200 py-6 text-center text-xs text-stone-500">
    © 2026 CollabX Platform. All rights reserved.
  </footer>

  <script>
    document.getElementById('forgotForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const formData = new FormData(this);

      try {
        const response = await fetch('api/auth/forgot-password.php', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();

        if (result.status === 200) {
          alert(result.message);
          window.location.href = 'login.html';
        } else {
          alert(result.message);
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Server error. Please try again');
      }
    });
  </script>
</body>
</html>
