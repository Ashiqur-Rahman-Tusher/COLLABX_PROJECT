<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password | CollabX</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./tailwind-config.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-stone-50 text-stone-900 font-sans antialiased min-h-screen flex flex-col justify-between">

  <nav class="sticky top-0 z-50 bg-stone-50/90 backdrop-blur-md border-b border-stone-200/80">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-700 flex items-center justify-center text-white font-bold text-xl">C</div>
        <span class="font-serif text-2xl font-bold tracking-tight text-stone-900">CollabX</span>
      </a>
      <a href="login.html" class="text-sm font-semibold bg-emerald-700 text-white px-5 py-2.5 rounded-full">Sign In</a>
    </div>
  </nav>

  <main class="flex-grow flex items-center justify-center py-12 px-6">
    <div class="w-full max-w-md bg-white rounded-3xl border border-stone-200 p-8 shadow-sm">
      <div class="text-center mb-8">
        <h1 class="text-2xl font-serif font-bold text-stone-900 mb-2">Set a New Password</h1>
        <p class="text-xs text-stone-600">Choose a strong password (min 8 characters, with letters and numbers).</p>
      </div>

      <form id="resetForm" class="space-y-6">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-2">New Password *</label>
          <input type="password" name="password" required minlength="8" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-stone-50 border border-stone-200 text-sm focus:outline-none focus:border-emerald-700">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-2">Confirm New Password *</label>
          <input type="password" name="confirm_password" required minlength="8" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-stone-50 border border-stone-200 text-sm focus:outline-none focus:border-emerald-700">
        </div>
        <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-medium py-3.5 rounded-xl transition">
          Change Password
        </button>
      </form>

      <p class="mt-6 text-center text-xs text-stone-500">
        Link expired? <a href="forgot-password.html" class="text-emerald-700 font-semibold hover:underline">Request a new one</a>
      </p>
    </div>
  </main>

  <footer class="bg-stone-100 border-t border-stone-200 py-6 text-center text-xs text-stone-500">
    © 2026 CollabX Platform. All rights reserved.
  </footer>

  <script src="assets/js/app.js"></script>
  <script>
    const token = App.qs('token');
    if (!token) {
      App.toast('This reset link is invalid. Please request a new one.', 'error');
    }

    document.getElementById('resetForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!token) return App.toast('Missing reset token. Please use the link from your email.', 'error');

      const form = event.target;
      const data = new FormData(form);
      data.append('token', token);

      const button = form.querySelector('button[type="submit"]');
      App.setBusy(button, true, 'Saving...');
      const res = await App.api('auth/reset-password.php', { method: 'POST', data });
      App.setBusy(button, false);

      if (res.status === 200) {
        App.toast(res.message, 'success');
        setTimeout(() => (window.location.href = 'login.html'), 1800);
      } else {
        App.toast(res.message, 'error');
      }
    });
  </script>
</body>
</html>
