<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Project Revenue | CollabX</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="./tailwind-config.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body data-require-role="idea_owner" class="bg-stone-50 text-stone-900 font-sans antialiased selection:bg-emerald-700 selection:text-white min-h-screen flex flex-col justify-between">

  <!-- Navbar -->
  <nav class="sticky top-0 z-50 bg-stone-50/90 backdrop-blur-md border-b border-stone-200/80">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-700 flex items-center justify-center text-white font-bold text-xl shadow-sm">C</div>
        <span class="font-serif text-2xl font-bold text-stone-900">CollabX</span>
      </a>
      <a href="ideaowner-dashboard.html" class="text-sm font-medium text-stone-600 hover:text-stone-900 transition">Back to Dashboard</a>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-3xl mx-auto px-6 py-10 flex-grow w-full space-y-8">

    <div class="border-b border-stone-200 pb-6">
      <h1 class="text-3xl font-serif font-bold text-stone-900">Record Project Revenue</h1>
      <p class="text-sm text-stone-600">Log new incoming earnings to calculate investor dividends and platform profit distribution.</p>
    </div>

    <div class="bg-white rounded-3xl border border-stone-200 p-8 shadow-sm space-y-6">
      <form id="revenueForm" class="space-y-5">
        <div>
          <label class="block text-xs font-bold text-stone-700 uppercase tracking-wider mb-2">Select Project</label>
          <select class="w-full px-4 py-3 rounded-xl bg-stone-50 border border-stone-200 text-sm focus:outline-none focus:border-emerald-700 transition">
            <option>AgriTech Supply Hub</option>
            <option>EcoSmart Plastic Recycler</option>
          </select>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-stone-700 uppercase tracking-wider mb-2">Revenue Amount (৳ BDT)</label>
            <input type="number" placeholder="e.g. 150000" required class="w-full px-4 py-3 rounded-xl bg-stone-50 border border-stone-200 text-sm focus:outline-none focus:border-emerald-700 transition">
          </div>
          <div>
            <label class="block text-xs font-bold text-stone-700 uppercase tracking-wider mb-2">Accounting Period</label>
            <input type="month" value="2026-09" class="w-full px-4 py-3 rounded-xl bg-stone-50 border border-stone-200 text-sm focus:outline-none focus:border-emerald-700 transition">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-stone-700 uppercase tracking-wider mb-2">Revenue Source / Invoice Ref</label>
          <input type="text" placeholder="e.g. B2B Client Contract #INV-8821" required class="w-full px-4 py-3 rounded-xl bg-stone-50 border border-stone-200 text-sm focus:outline-none focus:border-emerald-700 transition">
        </div>

        <div>
          <label class="block text-xs font-bold text-stone-700 uppercase tracking-wider mb-2">Proof of Earnings (Bank Slip / Statement)</label>
          <input type="file" class="w-full px-4 py-2.5 rounded-xl bg-stone-50 border border-stone-200 text-xs text-stone-600 focus:outline-none focus:border-emerald-700 transition">
        </div>

        <div class="pt-4 border-t border-stone-100 flex items-center justify-end gap-3">
          <a href="ideaowner-dashboard.html" class="text-xs font-semibold text-stone-600 hover:text-stone-900 transition">Cancel</a>
          <button type="submit" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-xs px-6 py-3.5 rounded-xl shadow-sm transition">
            Submit Revenue Entry
          </button>
        </div>
      </form>
    </div>

  </main>

  <footer class="bg-stone-100 border-t border-stone-200 py-6 text-center text-xs text-stone-500">
    © 2026 CollabX Platform. All rights reserved.
  </footer>

  <script>
    document.getElementById('revenueForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Revenue Logged Successfully! Investor dividends recalculated.');
      window.location.href = 'ideaowner-dashboard.html';
    });
  </script>
  <script src="assets/js/app.js"></script>
</body>
</html>
